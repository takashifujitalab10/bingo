 target.replaceChildren(...Array.from({length:N},(_,i)=>{
  const no=i+1,{rank,result}=participantResult(data,no),card=node('div','mobile-person'+(rank?' won':''));
  const name=node('span','person-name',nameOf(data,no));name.title=nameOf(data,no);card.append(node('span','person-no',pad(no)),name,result);return card;
 }));
}
function renderViewer(){
 const p=viewData,count=p.winners.length;$('viewerBall').textContent=p.drawn.at(-1)||'?';$('viewerCount').textContent=`${p.drawn.length} / 75 番号`;
 $('viewerNext').textContent=count===N?'全員ビンゴ！':`次のビンゴは ${prizeOf(count+1)}等`;$('viewerRemaining').textContent=`残り${N-count}人`;
 renderHistory($('viewerHistory'),p.drawn);renderBoard($('viewerBoard'),p.drawn);renderPeople($('viewerPeopleGrid'),p,false);
 $('viewerUpdated').textContent=`情報の更新：${new Date(p.updated).toLocaleString('ja-JP')}`;
}
function viewerStatus(text,live=false){$('viewerStatus').textContent=text;$('viewerStatus').className=live?'live':'stale';}
function startViewerSharing(){
 viewerSync?.stop();lastReceived=0;
 if(!validEventID(eventID)){viewerStatus('旧形式の閲覧リンクです。更新版のQRを最初に一度読み取ってください。以後は読み直さず最新情報を取得できます。');$('viewerReconnect').disabled=true;return;}
 viewerStatus('最新の抽選番号と当選状況を取得しています。');
 viewerSync=new LiveViewer(LIVE_ORIGIN,eventID,{
  onData:(snapshot,savedAt)=>{
   if(!validPublic(snapshot))throw Error('invalid_snapshot');
   viewData=snapshot;lastReceived=Date.now();storage.set(VIEW_CACHE+eventID,JSON.stringify(snapshot));renderViewer();
   $('viewerUpdated').textContent=`情報の更新：${new Date(savedAt||snapshot.updated).toLocaleString('ja-JP')}`;
  },
  onStatus:status=>{
   if(status==='live')viewerStatus('自動更新中・最新の番号と当選状況を表示しています',true);
   else if(status==='expired')viewerStatus('このイベントの共有期間が終了しました。司会者に確認してください。');
   else viewerStatus(viewData?'通信を再試行しています。表示は最終取得時点の情報です。':'最新情報を取得できません。ネット接続を確認してください。自動で再試行します。');
  }
 });
 viewerSync.start();
}
function viewerEvents(){
 $('viewerNumbersTab').onclick=()=>toggleViewer(false);$('viewerPeopleTab').onclick=()=>toggleViewer(true);$('viewerReconnect').onclick=startViewerSharing;
 function toggleViewer(people){$('viewerNumbers').hidden=people;$('viewerPeople').hidden=!people;$('viewerNumbersTab').classList.toggle('active',!people);$('viewerPeopleTab').classList.toggle('active',people);$('viewerNumbersTab').setAttribute('aria-pressed',String(!people));$('viewerPeopleTab').setAttribute('aria-pressed',String(people));}
}
function boot(){
  $('viewerApp').hidden=false;viewerEvents();
  if(validEventID(eventID)){
   try{const cached=JSON.parse(storage.get(VIEW_CACHE+eventID)||'null');if(validPublic(cached)){viewData=cached;renderViewer();}}catch{}
   if(!viewData){$('viewerCount').textContent='最新情報を取得しています';$('viewerNext').textContent='最新情報を取得中';$('viewerRemaining').textContent='';}
   startViewerSharing();
  }else{
   try{viewData=decodePublic(location.hash.startsWith('#s=')?location.hash.slice(3):'');renderViewer();}catch{}
   if(!viewData){$('viewerCount').textContent='閲覧リンクが必要です';$('viewerNext').textContent='司会者画面のQRを読み取ってください';$('viewerRemaining').textContent='';}
   viewerStatus('司会者画面のQRコードから開いてください。同じページを開いたまま最新情報を確認できます。');$('viewerReconnect').disabled=true;
  }

}
window.addEventListener('pagehide',()=>viewerSync?.stop());
window.addEventListener('pageshow',e=>{if(e.persisted&&validEventID(eventID))startViewerSharing();});
document.addEventListener('visibilitychange',()=>{if(validEventID(eventID)&&document.visibilityState==='visible')startViewerSharing();});
window.addEventListener('online',()=>{if(validEventID(eventID))startViewerSharing();});
window.addEventListener('hashchange',()=>location.reload());
boot();

})();
</script>
</body></html>
